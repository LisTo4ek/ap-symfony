parameters:
    rate_providers.cbr_rate_provider.api_url: 'https://cbr.ru/scripts/XML_daily.asp'
    rate_providers.cbr_rate_provider.monitored_currencies:
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::GBP
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::JPY
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::CNY
    rate_providers.cbr_rate_provider.timeout: 30
    rate_providers.cbr_rate_provider.retry_attempts: 3
    rate_providers.cbr_rate_provider.base_currency: !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::RUB
    rate_providers.cbr_rate_provider.encoding: 'windows-1251'

when@test:
    parameters:
        rate_providers.cbr_rate_provider.monitored_currencies:
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
        rate_providers.cbr_rate_provider.timeout: 5
        rate_providers.cbr_rate_provider.retry_attempts: 1

when@dev:
    parameters:
        rate_providers.cbr_rate_provider.monitored_currencies:
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
        rate_providers.cbr_rate_provider.timeout: 60
        rate_providers.cbr_rate_provider.retry_attempts: 1
