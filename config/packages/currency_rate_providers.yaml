parameters:
    currency_rate_providers.cbr_provider.api_url: 'https://cbr.ru/scripts/XML_daily.asp'
    currency_rate_providers.cbr_provider.monitored_currencies:
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::GBP
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::JPY
        - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::CNY
    currency_rate_providers.cbr_provider.timeout: 30
    currency_rate_providers.cbr_provider.retry_attempts: 3
    currency_rate_providers.cbr_provider.base_currency: !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::RUB
#    currency_rate_providers.cbr_provider.encoding: 'windows-1251'

when@test:
    parameters:
        currency_rate_providers.cbr_provider.monitored_currencies:
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
        currency_rate_providers.cbr_provider.timeout: 5
        currency_rate_providers.cbr_provider.retry_attempts: 1

when@dev:
    parameters:
        currency_rate_providers.cbr_provider.monitored_currencies:
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::USD
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::EUR
            - !php/enum App\Domain\CurrencyRateProvider\Base\CurrencyEnum::IRR
        currency_rate_providers.cbr_provider.timeout: 60
        currency_rate_providers.cbr_provider.retry_attempts: 1
